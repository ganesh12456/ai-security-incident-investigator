name: Deploy to Catalyst development

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalyst-development
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify project
        run: npm run check
      - name: Verify deployment credential is configured
        env:
          CATALYST_TOKEN: ${{ secrets.CATALYST_TOKEN }}
        run: |
          if [ -z "$CATALYST_TOKEN" ]; then
            echo 'Set the CATALYST_TOKEN repository secret before running this workflow.'
            exit 1
          fi
      - name: Install Catalyst CLI
        run: npm install --global zcatalyst-cli
      - name: Deploy investigator and client to development
        env:
          CATALYST_TOKEN: ${{ secrets.CATALYST_TOKEN }}
        run: >-
          catalyst deploy --ni --only client,functions:investigator
          --project 54566000000077001 --org 60077364156 --dc in
          --token "$CATALYST_TOKEN"
      - name: Check deployed API
        run: >-
          curl --fail --show-error --silent --location
          --retry 5 --retry-delay 5
          https://ai-incident-investigator-60077364156.development.catalystserverless.in/server/investigator/api/health
